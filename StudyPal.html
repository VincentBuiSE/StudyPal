<!DOCTYPE html>
<html>
<head>
<title>Flashcard App</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        margin: 0;
        padding: 20px;
    }

    h1 {
        color: #333;
        text-align: center;
    }

    h2 {
        color: #333;
    }

    .container {
        max-width: 500px;
        margin: 0 auto;
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        border: 1px solid #ccc;
    }

    .screen {
        display: none;
    }

    .screen.active {
        display: block;
    }

    button {
        background-color: #4CAF50;
        color: white;
        border: none;
        padding: 10px 20px;
        margin: 5px 0px;
        border-radius: 5px;
        cursor: pointer;
        width: 100%;
        font-size: 16px;
    }

    button:hover {
        background-color: #45a049;
    }

    #backBtn, #backBtn2, #backBtn3, #backBtn4, #backBtn5 {
        background-color: #aaa;
        width: auto;
        padding: 6px 14px;
        font-size: 14px;
    }

    input[type="text"] {
        width: 95%;
        padding: 8px;
        margin: 5px 0px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 15px;
    }

    textarea {
        width: 95%;
        padding: 8px;
        margin: 5px 0px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 15px;
        height: 80px;
    }

    .flashcard {
        background-color: #fff9c4;
        border: 1px solid #f0c040;
        border-radius: 6px;
        padding: 10px;
        margin: 8px 0px;
    }

    .flashcard p {
        margin: 3px 0px;
        font-size: 14px;
    }

    .removeBtn {
        background-color: #e74c3c;
        width: auto;
        padding: 4px 10px;
        font-size: 13px;
        float: right;
    }

    .removeBtn:hover {
        background-color: #c0392b;
    }

    #quizBox {
        background-color: #e8f4f8;
        border: 2px solid #3498db;
        border-radius: 8px;
        padding: 20px;
        text-align: center;
        font-size: 18px;
        margin: 10px 0px;
        min-height: 80px;
    }

    #feedback {
        font-size: 15px;
        font-weight: bold;
        margin: 8px 0px;
    }

    .correct { color: green; }
    .wrong { color: red; }

    #scoreDiv {
        text-align: center;
        font-size: 22px;
        margin: 20px 0px;
    }

    #nextBtn, #submitBtn {
        background-color: #3498db;
    }

    #nextBtn:hover, #submitBtn:hover {
        background-color: #2980b9;
    }

    #saveCardBtn {
        background-color: #9b59b6;
    }

    #saveCardBtn:hover {
        background-color: #8e44ad;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Flashcard App</h1>

    <div id="screen0" class="screen active">
        <h2>Pick a Subject</h2>
        <button onclick="goToSubject('math')">Math</button>
        <button onclick="goToSubject('science')">Science</button>
        <button onclick="goToSubject('history')">History</button>
        <button onclick="goToSubject('english')">English</button>
        <br><br>
        <button onclick="exportCards()" style="background-color:#888;">Export Cards</button>
        <label style="display:block; margin-top:5px;">
            <button style="background-color:#888;" onclick="document.getElementById('importFile').click()">Import Cards</button>
            <input type="file" id="importFile" style="display:none;" accept=".json" onchange="importCards(event)">
        </label>
    </div>

    <div id="screen1" class="screen">
        <button id="backBtn" onclick="goBack()">Back</button>
        <h2 id="subjectTitle">Subject</h2>
        <button onclick="showScreen('screen2')">Add Flashcard</button>
        <button onclick="startQuiz()">Quiz Me!</button>
        <button onclick="showCards()">View Cards</button>
        <button onclick="showRemove()">Remove a Card</button>
    </div>

    <div id="screen2" class="screen">
        <button id="backBtn2" onclick="showScreen('screen1')">Back</button>
        <h2>Add a Card</h2>
        <p>Question:</p>
        <input type="text" id="questionInput" placeholder="type question here" /><br>
        <p>Answer:</p>
        <textarea id="answerInput" placeholder="type answer here"></textarea><br>
        <button id="saveCardBtn" onclick="saveCard()">Save Card</button>
        <p id="savedMsg" style="color:green; display:none;">Card saved!</p>
    </div>

    <div id="screen3" class="screen">
        <button id="backBtn3" onclick="showScreen('screen1')">Back</button>
        <h2>Your Cards</h2>
        <div id="cardList"></div>
    </div>

    <div id="screen4" class="screen">
        <button id="backBtn4" onclick="showScreen('screen1')">Back</button>
        <h2>Remove a Card</h2>
        <div id="removeList"></div>
    </div>

    <div id="screen5" class="screen">
        <button id="backBtn5" onclick="showScreen('screen1')">Back</button>
        <p id="quizProgress" style="color:#888; font-size:13px;"></p>
        <div id="quizBox">loading question...</div>
        <input type="text" id="quizAnswer" placeholder="your answer..." onkeydown="if(event.key=='Enter') checkAns()" />
        <button id="submitBtn" onclick="checkAns()">Submit</button>
        <p id="feedback"></p>
        <button id="nextBtn" onclick="nextQ()" style="display:none;">Next</button>
    </div>

    <div id="screen6" class="screen">
        <button onclick="showScreen('screen1')" style="background-color:#aaa;width:auto;padding:6px 14px;font-size:14px;">Back</button>
        <div id="scoreDiv"></div>
        <button onclick="startQuiz()">Play Again</button>
    </div>
</div>

<script>
    var currentSubject = "";
    var quizCards = [];
    var quizIndex = 0;
    var score = 0;

    function showScreen(id) {
        var screens = document.querySelectorAll('.screen');
        for (var i = 0; i < screens.length; i++) {
            screens[i].classList.remove('active');
        }
        document.getElementById(id).classList.add('active');
    }

    function goToSubject(subject) {
        currentSubject = subject;
        document.getElementById('subjectTitle').innerText = subject.charAt(0).toUpperCase() + subject.slice(1);
        showScreen('screen1');
    }

    function goBack() {
        showScreen('screen0');
    }

    function getCards() {
        var data = localStorage.getItem('cards_' + currentSubject);
        if (data == null) return [];
        return JSON.parse(data);
    }

    function saveCards(cards) {
        localStorage.setItem('cards_' + currentSubject, JSON.stringify(cards));
    }

    function saveCard() {
        var q = document.getElementById('questionInput').value.trim();
        var a = document.getElementById('answerInput').value.trim();

        if (q == "" || a == "") {
            alert("Please fill in both fields!");
            return;
        }

        var cards = getCards();
        cards.push({question: q, answer: a});
        saveCards(cards);

        document.getElementById('questionInput').value = '';
        document.getElementById('answerInput').value = '';
        document.getElementById('savedMsg').style.display = 'block';
        setTimeout(function() {
            document.getElementById('savedMsg').style.display = 'none';
        }, 2000);
    }

    function showCards() {
        var cards = getCards();
        var html = '';
        if (cards.length == 0) {
            html = '<p>No cards yet!</p>';
        }
        for (var i = 0; i < cards.length; i++) {
            html += '<div class="flashcard">';
            html += '<p><b>Q:</b> ' + cards[i].question + '</p>';
            html += '<p><b>A:</b> ' + cards[i].answer + '</p>';
            html += '</div>';
        }
        document.getElementById('cardList').innerHTML = html;
        showScreen('screen3');
    }

    function showRemove() {
        var cards = getCards();
        var html = '';
        if (cards.length == 0) {
            html = '<p>No cards to remove.</p>';
        }
        for (var i = 0; i < cards.length; i++) {
            html += '<div class="flashcard">';
            html += '<button class="removeBtn" onclick="removeCard(' + i + ')">Delete</button>';
            html += '<p><b>Q:</b> ' + cards[i].question + '</p>';
            html += '<p><b>A:</b> ' + cards[i].answer + '</p>';
            html += '</div>';
        }
        document.getElementById('removeList').innerHTML = html;
        showScreen('screen4');
    }

    function removeCard(index) {
        var cards = getCards();
        cards.splice(index, 1);
        saveCards(cards);
        showRemove();
    }

    function startQuiz() {
        var cards = getCards();
        if (cards.length == 0) {
            alert("You don't have any cards yet!");
            return;
        }


        quizCards = cards.slice();
        for (var i = quizCards.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var temp = quizCards[i];
            quizCards[i] = quizCards[j];
            quizCards[j] = temp;
        }

        quizIndex = 0;
        score = 0;
        showScreen('screen5');
        loadQuestion();
    }

    function loadQuestion() {
        document.getElementById('quizProgress').innerText = 'Question ' + (quizIndex + 1) + ' of ' + quizCards.length;
        document.getElementById('quizBox').innerText = quizCards[quizIndex].question;
        document.getElementById('quizAnswer').value = '';
        document.getElementById('quizAnswer').disabled = false;
        document.getElementById('feedback').innerText = '';
        document.getElementById('feedback').className = '';
        document.getElementById('nextBtn').style.display = 'none';
        document.getElementById('quizAnswer').focus();
    }

    function checkAns() {
        var userAns = document.getElementById('quizAnswer').value.trim().toLowerCase();
        var correctAns = quizCards[quizIndex].answer.trim().toLowerCase();

        document.getElementById('quizAnswer').disabled = true;

        if (userAns == correctAns) {
            document.getElementById('feedback').innerText = 'Correct!!';
            document.getElementById('feedback').className = 'correct';
            score++;
        } else {
            document.getElementById('feedback').innerText = 'Wrong. Answer was: ' + quizCards[quizIndex].answer;
            document.getElementById('feedback').className = 'wrong';
        }

        if (quizIndex + 1 >= quizCards.length) {
            document.getElementById('nextBtn').innerText = 'See Score';
            document.getElementById('nextBtn').onclick = showScore;
        } else {
            document.getElementById('nextBtn').innerText = 'Next';
            document.getElementById('nextBtn').onclick = nextQ;
        }
        document.getElementById('nextBtn').style.display = 'block';
    }

    function nextQ() {
        quizIndex++;
        loadQuestion();
    }

    function showScore() {
        var pct = Math.round((score / quizCards.length) * 100);
        var msg = '';
        if (pct >= 80) msg = 'Nice job!';
        else if (pct >= 50) msg = 'Keep studying!';
        else msg = 'You need more practice lol';

        document.getElementById('scoreDiv').innerHTML = '<p>Score: ' + score + '/' + quizCards.length + '</p><p>' + pct + '%</p><p>' + msg + '</p>';
        showScreen('screen6');
    }

    function exportCards() {
        var allData = {};
        var subjects = ['math', 'science', 'history', 'english'];
        for (var i = 0; i < subjects.length; i++) {
            var data = localStorage.getItem('cards_' + subjects[i]);
            if (data) allData[subjects[i]] = JSON.parse(data);
        }
        var blob = new Blob([JSON.stringify(allData)], {type: 'application/json'});
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'flashcards.json';
        a.click();
    }

    function importCards(event) {
        var file = event.target.files[0];
        var reader = new FileReader();
        reader.onload = function(e) {
            try {
                var data = JSON.parse(e.target.result);
                var subjects = Object.keys(data);
                for (var i = 0; i < subjects.length; i++) {
                    localStorage.setItem('cards_' + subjects[i], JSON.stringify(data[subjects[i]]));
                }
                alert('Cards imported!');
            } catch(err) {
                alert('Something went wrong reading the file');
            }
        };
        reader.readAsText(file);
    }
</script>

</body>
</html>
